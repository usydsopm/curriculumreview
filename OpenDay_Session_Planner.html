<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Day Session Planner — USyd SoPM</title>
<style>
  :root{
    --cream:#ffffff;
    --page-bg:#fdfbfa;
    --charcoal:#414143;
    --charcoal-soft:#6c6c6e;
    --line: rgba(65,65,67,0.10);
    --line-strong: rgba(65,65,67,0.20);
    --advising:#f6583c;
    --advising-fill:#fde2dc;
    --advising-fill-soft:#fef3f0;
    --activations:#414143;
    --activations-text:#414143;
    --activations-fill:#e7e7e8;
    --activations-fill-soft:#f4f4f5;
    --card:#ffffff;
    --shadow: 0 1px 2px rgba(65,65,67,0.06), 0 6px 20px rgba(246,88,60,0.12);
    --shadow-lift: 0 4px 10px rgba(65,65,67,0.10), 0 10px 28px rgba(246,88,60,0.18);
    --radius: 14px;
    --hour-height: 88px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 420px at 12% -10%, rgba(246,88,60,0.08), transparent 60%),
      radial-gradient(900px 380px at 100% 0%, rgba(65,65,67,0.06), transparent 55%),
      var(--page-bg);
    color:var(--charcoal);
    font-family:"Instrument Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2{
    font-family:"Capraismo", "Caprasimo", Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight:500;
    margin:0;
  }
  .mono{
    font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    letter-spacing:0.01em;
  }
  #app{
    max-width:1720px;
    margin:0 auto;
    padding:40px 28px 64px;
  }
  header{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:18px;
    margin-bottom:32px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line-strong);
    position:relative;
  }
  header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:3px;
    width:180px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--advising), var(--activations-fill));
  }
  header .titles{display:flex;flex-direction:column;gap:6px;}
  header h1{font-size:2rem; letter-spacing:0.01em;}
  header .subtitle{color:var(--charcoal-soft);font-size:0.92rem; font-style:italic;}
  .controls{
    display:flex;
    align-items:flex-end;
    gap:14px;
    flex-wrap:wrap;
  }
  .controls label{
    display:flex;
    flex-direction:column;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--charcoal-soft);
    gap:4px;
  }
  .controls input[type=time]{
    font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:7px 10px;
    font-size:0.9rem;
    background:var(--card);
    color:var(--charcoal);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .controls input[type=time]:focus{
    outline:none;
    border-color:var(--advising);
    box-shadow:0 0 0 3px rgba(246,88,60,0.22);
  }
  button{
    font-family:inherit;
    font-size:0.82rem;
    font-weight:600;
    letter-spacing:0.02em;
    border:1px solid var(--charcoal);
    background:var(--charcoal);
    color:var(--cream);
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, opacity .15s ease, background .15s ease;
  }
  button.secondary{
    background:transparent;
    color:var(--charcoal);
    border-color:var(--line-strong);
  }
  button.secondary:hover{
    border-color:var(--advising);
    color:var(--charcoal);
    background:var(--advising-fill-soft);
    opacity:1;
  }
  button:hover{opacity:0.9; transform:translateY(-1px); box-shadow:var(--shadow-lift);}
  button:active{transform:scale(0.97) translateY(0);}

  .calendar-wrap{
    position:relative;
    display:grid;
    grid-template-columns: 64px 1.1fr 1.1fr 0.55fr;
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--card);
    box-shadow:var(--shadow);
  }
  .fixed-block{
    position:absolute;
    z-index:10;
    background:repeating-linear-gradient(135deg, rgba(43,43,44,0.04), rgba(43,43,44,0.04) 8px, rgba(43,43,44,0.075) 8px, rgba(43,43,44,0.075) 16px);
    border-top:2px solid var(--charcoal);
    border-bottom:2px solid var(--charcoal);
    pointer-events:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    padding:2px 12px;
    text-align:center;
  }
  .fixed-block .fb-title{
    font-size:0.78rem;
    font-weight:700;
    color:var(--charcoal);
    white-space:normal;
    overflow-wrap:break-word;
    line-height:1.25;
  }
  .fixed-block .fb-loc{
    font-size:0.68rem;
    color:var(--charcoal-soft);
    font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  }
  .fixed-block .fb-loc::before{
    content:"📍 ";
  }
  .fixed-block-scoped{
    background:rgba(246,88,60,0.08);
    border-top:2px dashed rgba(43,43,44,0.35);
    border-bottom:2px dashed rgba(43,43,44,0.35);
    align-items:flex-start;
    justify-content:flex-start;
    padding:4px 8px;
  }
  .fixed-block-scoped .fb-title{
    font-size:0.66rem;
    font-weight:600;
    opacity:0.6;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .talk-card{
    position:absolute;
    left:6px; right:6px;
    z-index:5;
    background:var(--card);
    border:1px solid var(--line-strong);
    border-left:4px solid var(--charcoal);
    border-radius:10px;
    padding:8px 10px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:3px;
    justify-content:center;
  }
  .talk-card .tc-title{
    font-size:0.8rem;
    font-weight:700;
    color:var(--charcoal);
    line-height:1.25;
  }
  .talk-card .tc-time{
    font-size:0.72rem;
    color:var(--charcoal-soft);
  }
  .talk-card .tc-loc{
    font-size:0.7rem;
    color:var(--charcoal-soft);
    font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  }
  .talk-card .tc-loc::before{
    content:"📍 ";
  }
  .talk-card .tc-chips{
    display:flex;
    flex-direction:column;
    gap:5px;
    margin-top:4px;
  }
  .talk-card .tc-chip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    background:var(--acc, #f6583c);
    border-radius:6px;
    padding:4px 7px;
  }
  .talk-card .tc-chip-name{
    font-size:0.72rem;
    font-weight:700;
    color:var(--charcoal);
    line-height:1.2;
    overflow-wrap:break-word;
  }
  .talk-card .tc-chip-close{
    border:none;
    background:none;
    color:var(--charcoal);
    opacity:0.55;
    font-size:0.62rem;
    cursor:pointer;
    padding:0;
    flex-shrink:0;
  }
  .talk-card .tc-chip-close:hover{opacity:1;}
  .col-headers{
    display:contents;
  }
  .gutter-header, .column-header{
    padding:14px 12px;
    font-size:0.78rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.07em;
    border-bottom:1px solid var(--line-strong);
  }
  .gutter-header{background:var(--card);}
  .column-header.advising{background:var(--advising-fill); color:var(--activations-text);}
  .column-header.talk{
    background:#f4f4f5;
    color:var(--charcoal);
    border-top:3px solid var(--charcoal);
  }
  .column-header.activations{background:var(--activations-fill); color:var(--activations-text); border-top:3px solid var(--activations);}
  .column-header.advising{border-top:3px solid var(--advising);}
  .column-header .venue{
    display:block;
    font-size:0.66rem;
    font-weight:600;
    letter-spacing:0.08em;
    opacity:0.75;
    margin-top:2px;
    font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  }

  .time-gutter{
    position:relative;
    border-right:1px solid var(--line-strong);
    background:var(--card);
  }
  .time-gutter .tick{
    position:absolute;
    right:8px;
    transform:translateY(-50%);
    font-size:0.68rem;
    color:var(--charcoal-soft);
  }
  .time-gutter .tick.tick-half{
    font-size:0.6rem;
    opacity:0.7;
  }
  .column-body{
    position:relative;
    border-right:1px solid var(--line-strong);
  }
  .column-body.advising{background:var(--advising-fill-soft);}
  .column-body.activations{background:var(--activations-fill-soft);}
  .column-body.talk{background:#fafafa;}
  .column-body:last-child{border-right:none;}
  .gridline{
    position:absolute;
    left:0; right:0;
    border-top:1px solid var(--line);
  }
  .gridline.hour{border-top:1px solid var(--line-strong);}
  .column-body.drop-hover{ outline: 2px dashed var(--charcoal); outline-offset:-2px; }

  .event{
    position:absolute;
    z-index:3;
    left:6px; right:6px;
    border-radius:12px;
    padding:6px 8px 7px;
    box-shadow:var(--shadow);
    cursor:grab;
    display:flex;
    flex-direction:column;
    gap:2px;
    overflow:hidden;
    border-left:3px solid rgba(43,43,44,0.2);
    background:var(--acc, #f6583c);
    touch-action:none;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .event:hover{ box-shadow:var(--shadow-lift); transform:translateY(-1px); }
  .event:active{cursor:grabbing;}
  .event .ev-name{
    font-size:0.82rem;
    font-weight:700;
    color:var(--charcoal);
    white-space:normal;
    overflow-wrap:break-word;
    line-height:1.2;
  }
  .event .ev-time{
    font-size:0.68rem;
    color:var(--charcoal-soft);
  }
  .event .ev-time input[type=time]{
    width:64px;
    font-size:0.68rem;
    border:1px solid var(--line-strong);
    border-radius:4px;
    padding:1px 3px;
    font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  .event .ev-close{
    position:absolute;
    top:3px; right:4px;
    font-size:0.68rem;
    color:var(--charcoal-soft);
    cursor:pointer;
    background:none;
    border:none;
    padding:2px 4px;
    line-height:1;
    border-radius:50%;
    transition:background .12s ease, color .12s ease;
  }
  .event .ev-close:hover{color:var(--charcoal); background:rgba(43,43,44,0.10);}
  .event .resize-handle{
    position:absolute;
    left:0; right:0; bottom:0;
    height:8px;
    cursor:ns-resize;
  }
  .event.dragging-ghost{
    opacity:0.55;
    pointer-events:none;
  }

  .tray{
    margin-top:36px;
  }
  .tray-label-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .tray-label{
    font-size:0.78rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.07em;
    color:var(--charcoal-soft);
  }
  .tray-tiles{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:16px;
    background:linear-gradient(180deg, var(--card), var(--page-bg));
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    min-height:64px;
    box-shadow:var(--shadow);
  }
  .tile{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--acc, #eee);
    border:1px solid rgba(43,43,44,0.14);
    border-radius:8px;
    padding:8px 12px;
    cursor:grab;
    user-select:none;
    touch-action:none;
    box-shadow:0 1px 2px rgba(43,43,44,0.08);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .tile:hover{ box-shadow:var(--shadow-lift); transform:translateY(-1px); }
  .tile:active{cursor:grabbing;}
  .tile .name{
    font-size:0.85rem;
    font-weight:700;
    min-width:36px;
    outline:none;
    color:var(--charcoal);
  }
  .tile .del-academic{
    border:none;background:none;color:var(--charcoal);
    opacity:0.55;
    font-size:0.72rem; cursor:pointer; padding:0 0 0 4px;
  }
  .tile .del-academic:hover{opacity:1;}

  .hint{
    font-size:0.78rem;
    color:var(--charcoal-soft);
    margin-top:12px;
    line-height:1.6;
    font-style:italic;
  }
  .drag-clone{
    position:fixed;
    z-index:999;
    pointer-events:none;
    opacity:0.85;
  }
  @media (max-width:720px){
    .calendar-wrap{grid-template-columns: 46px 1.1fr 1.1fr 0.55fr;}
    header{align-items:stretch;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titles">
      <h1>Open Day Session Planner</h1>
      <div class="subtitle">School of Project Management</div>
    </div>
    <div class="controls">
      <label>Day starts
        <input type="time" id="dayStart" value="08:45">
      </label>
      <label>Day ends
        <input type="time" id="dayEnd" value="16:30">
      </label>
      <button class="secondary" id="clearBtn" type="button">Clear placements</button>
    </div>
  </header>

  <div class="calendar-wrap" id="calendarWrap">
    <div class="col-headers">
      <div class="gutter-header"></div>
      <div class="column-header advising">Course Advising<span class="venue">J03 Foyer</span></div>
      <div class="column-header activations">Activations<span class="venue">J03 Room 270 (North Space)</span></div>
      <div class="column-header talk">BPM Talk<span class="venue">Carslaw 173</span></div>
    </div>
    <div class="time-gutter" id="timeGutter"></div>
    <div class="column-body advising" data-column="advising" id="body-advising"></div>
    <div class="column-body activations" data-column="activations" id="body-activations"></div>
    <div class="column-body talk" data-column="talk" id="body-talk"></div>
  </div>

  <div class="tray">
    <div class="tray-label-row">
      <div class="tray-label">Academics</div>
    </div>
    <div class="tray-tiles" id="trayTiles"></div>
  </div>

  <div class="tray">
    <div class="tray-label-row">
      <div class="tray-label">Professional Staff &amp; Students</div>
    </div>
    <div class="tray-tiles" id="staffTrayTiles"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var PALETTE = ["#f6583c","#f78169","#d94425","#e7e7e8","#8f8f91","#fbb6a4","#6c6c6e","#fde2dc"];
  var paletteIndex = 0;
  function nextColor(){
    var c = PALETTE[paletteIndex % PALETTE.length];
    paletteIndex++;
    return c;
  }

  var SNAP = 15; // minutes
  var DEFAULT_DURATION = 30; // minutes
  var MIN_DURATION = 15;

  var state = {
    dayStartMin: 8*60+45,
    dayEndMin: 16*60+30,
    academics: [],
    staff: [],
    events: [],
    fixedBlocks: [
      { id: "fx1", title: "Bachelor of Project Management talk", location: "Carslaw Lecture Theatre 173", startAbsMin: 12*60, duration: 30 }
    ]
  };

  var uid = 1;
  function nextId(prefix){ return prefix + (uid++); }

  // ---------- persistence (best-effort; safe if storage unavailable) ----------
  var STORAGE_KEY = "openday-planner-events-v3";
  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ events: state.events }));
    }catch(e){ /* ignore */ }
  }
  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.events)){
          state.events = parsed.events;
        }
      }
    }catch(e){ /* ignore */ }
  }

  var NAME_COLORS = {
    "jeff": "#e8cff6",
    "jin": "#ed8d9c",
    "neda": "#eb7b81",
    "xinyue": "#f3b7c8",
    "oliver": "#cbccff",
    "carolina": "#ef9799",
    "hoonyong": "#f0ba84",
    "xiaoshan": "#d0f1da",
    "ken": "#f9cb9b"
  };
  function colorForName(name){
    var lower = name.toLowerCase();
    for(var key in NAME_COLORS){
      if(lower.indexOf(key) !== -1) return NAME_COLORS[key];
    }
    return null;
  }

  function seedDefaults(){
    if(state.academics.length) return;
    var names = [
      "Xiaoshan Zhou",
      "Ken Chung",
      "Hoonyong Lee",
      "Carolina Zani",
      "Neda Mohammadi",
      "Jin Xue",
      "Xinyue Zhang",
      "Jeffrey Scales",
      "Oliver Young"
    ];
    names.forEach(function(name){
      state.academics.push({ id: nextId("ac"), name: name, color: colorForName(name) || nextColor() });
    });
  }

  function findAcademicIdByName(name){
    var found = state.academics.filter(function(a){ return a.name === name; })[0];
    if(!found) found = state.staff.filter(function(a){ return a.name === name; })[0];
    return found ? found.id : null;
  }

  function seedDefaultEvents(){
    if(state.events.length) return;
    var defs = [
      { name: "Oliver Young",   column: "talk",         startAbsMin: 12*60,    duration: 30 },                     // 12-12:30pm
      { name: "Jin Xue",        column: "advising",     startAbsMin: 12*60+30, duration: (16*60+15) - (12*60+30) }, // 12:30pm-4:15pm
      { name: "Hoonyong Lee",   column: "activations",  startAbsMin: 8*60+45,  duration: (12*60+30) - (8*60+45) }, // 8:45am-12:30pm
      { name: "Carolina Zani",  column: "advising",     startAbsMin: 12*60+30, duration: (16*60+15) - (12*60+30) }, // 12:30pm-4:15pm
      { name: "Oliver Young",   column: "advising",     startAbsMin: 12*60+30, duration: (16*60+15) - (12*60+30) }, // 12:30pm-4:15pm
      { name: "Jeffrey Scales", column: "advising",     startAbsMin: 8*60+45,  duration: (12*60+30) - (8*60+45), labelDuration: (12*60+45) - (8*60+45) }, // shown as 8:45am-12:45pm, occupies to 12:30pm so it doesn't force a wider overlap split
      { name: "Xiaoshan Zhou",  column: "advising",     startAbsMin: 8*60+45,  duration: (12*60+30) - (8*60+45), labelDuration: (12*60+45) - (8*60+45) }, // shown as 8:45am-12:45pm, occupies to 12:30pm so it doesn't force a wider overlap split
      { name: "Neda Mohammadi", column: "advising",     startAbsMin: 8*60+45,  duration: (11*60) - (8*60+45) },    // 8:45am-11am
      { name: "Hee Eun Lim",    column: "activations",  startAbsMin: 8*60+45,  duration: (12*60+30) - (8*60+45) }, // 8:45am-12:30pm
      { name: "Jinyoung Kim",   column: "activations",  startAbsMin: 12*60+30, duration: (16*60+15) - (12*60+30) }, // 12:30pm-4:15pm
      { name: "Steven Chung",   column: "activations",  startAbsMin: 8*60+45,  duration: (12*60+30) - (8*60+45) }, // 8:45am-12:30pm
      { name: "PMSoc Rep #1",   column: "activations",  startAbsMin: 8*60+45,  duration: (12*60+30) - (8*60+45) }, // 8:45am-12:30pm
      { name: "Courtney Hunter", column: "activations", startAbsMin: 12*60+30, duration: (16*60+15) - (12*60+30) }, // 12:30pm-4:15pm
      { name: "PMSoc Rep #2",   column: "activations",  startAbsMin: 12*60+30, duration: (16*60+15) - (12*60+30) }, // 12:30pm-4:15pm
      { name: "Courtney Hunter", column: "advising",    startAbsMin: 8*60+45,  duration: (12*60+30) - (8*60+45) }, // 8:45am-12:30pm
      { name: "Steven Chung",   column: "advising",     startAbsMin: 12*60+30, duration: (16*60+15) - (12*60+30) }  // 12:30pm-4:15pm
    ];
    defs.forEach(function(d){
      var id = findAcademicIdByName(d.name);
      if(!id) return;
      state.events.push({
        id: nextId("ev"),
        academicId: id,
        column: d.column,
        startMin: d.startAbsMin - state.dayStartMin,
        duration: d.duration,
        labelDuration: d.labelDuration || null
      });
    });
  }

  function seedStaffDefaults(){
    if(state.staff.length) return;
    var people = [
      { name: "Courtney Hunter", color: "#B4E7EC" },
      { name: "Steven Chung", color: "#C6D5E5" },
      { name: "Hee Eun Lim", color: "#FF6FA5" },
      { name: "Jinyoung Kim", color: "#4FC3F7" },
      { name: "PMSoc Rep #1", color: "#5CE1D6" },
      { name: "PMSoc Rep #2", color: "#FF8360" }
    ];
    people.forEach(function(p){
      state.staff.push({ id: nextId("st"), name: p.name, color: p.color });
    });
  }

  // ---------- helpers ----------
  function timeStrToMin(str){
    var parts = str.split(":");
    return parseInt(parts[0],10)*60 + parseInt(parts[1],10);
  }
  function minToTimeStr(min){
    min = ((min % 1440) + 1440) % 1440;
    var h = Math.floor(min/60);
    var m = min % 60;
    return (h<10?"0":"")+h+":"+(m<10?"0":"")+m;
  }
  function minToTime12(min){
    min = ((min % 1440) + 1440) % 1440;
    var h = Math.floor(min/60);
    var m = min % 60;
    var period = h < 12 ? "AM" : "PM";
    var h12 = h % 12;
    if(h12 === 0) h12 = 12;
    if(m === 0) return h12 + " " + period;
    return h12 + ":" + (m<10?"0":"")+m + " " + period;
  }
  function pxPerMin(){ return state.hourHeightPx ? state.hourHeightPx/60 : 88/60; }
  function initials(name){
    var parts = name.replace(/^(Dr\.|Prof\.|A\/Prof\.|Mr\.|Ms\.|Mrs\.)\s*/i,"").trim().split(/\s+/);
    return parts.slice(0,2).map(function(p){return p.charAt(0).toUpperCase();}).join("");
  }

  // ---------- DOM refs ----------
  var timeGutter = document.getElementById("timeGutter");
  var bodyAdvising = document.getElementById("body-advising");
  var bodyActivations = document.getElementById("body-activations");
  var bodyTalk = document.getElementById("body-talk");
  var trayTiles = document.getElementById("trayTiles");
  var staffTrayTiles = document.getElementById("staffTrayTiles");
  var dayStartInput = document.getElementById("dayStart");
  var dayEndInput = document.getElementById("dayEnd");

  function columnBodyFor(col){
    if(col === "advising") return bodyAdvising;
    if(col === "talk") return bodyTalk;
    return bodyActivations;
  }

  // ---------- rendering ----------
  function renderGutterAndGrid(){
    var totalMin = state.dayEndMin - state.dayStartMin;
    var heightPx = totalMin * pxPerMin();
    timeGutter.style.height = heightPx + "px";
    bodyAdvising.style.height = heightPx + "px";
    bodyActivations.style.height = heightPx + "px";
    bodyTalk.style.height = heightPx + "px";

    timeGutter.innerHTML = "";
    [bodyAdvising, bodyActivations].forEach(function(col){
      var existing = col.querySelectorAll(".gridline");
      existing.forEach(function(g){ g.remove(); });
    });

    var start = state.dayStartMin, end = state.dayEndMin;
    var preEnd = end - 15;
    var alignedStart = Math.ceil(start/30)*30;
    var alignedEnd = Math.floor(preEnd/30)*30;

    var ticks = [start];
    for(var m = alignedStart; m <= alignedEnd; m += 30){
      ticks.push(m);
    }
    if(preEnd > start) ticks.push(preEnd);

    ticks = Array.from(new Set(ticks)).sort(function(a,b){ return a-b; });
    ticks = ticks.filter(function(t){ return t >= start && t <= end; });

    ticks.forEach(function(m){
      var y = (m - state.dayStartMin) * pxPerMin();
      var isHour = (m % 60 === 0);
      var tick = document.createElement("div");
      tick.className = "tick mono" + (isHour ? "" : " tick-half");
      tick.style.top = y + "px";
      tick.textContent = minToTime12(m);
      timeGutter.appendChild(tick);
      [bodyAdvising, bodyActivations].forEach(function(col){
        var line = document.createElement("div");
        line.className = "gridline" + (isHour ? " hour" : "");
        line.style.top = y + "px";
        col.appendChild(line);
      });
    });
  }

  function academicById(id){
    for(var i=0;i<state.academics.length;i++){
      if(state.academics[i].id === id) return state.academics[i];
    }
    for(var j=0;j<state.staff.length;j++){
      if(state.staff[j].id === id) return state.staff[j];
    }
    return null;
  }

  function computeLaneLayout(columnEvents){
    var sorted = columnEvents.slice().sort(function(a,b){
      if(a.startMin !== b.startMin) return a.startMin - b.startMin;
      return b.duration - a.duration;
    });
    var layout = {};
    var cluster = [];
    var clusterEnd = -Infinity;

    function flushCluster(){
      if(!cluster.length) return;
      var columns = [];
      cluster.forEach(function(ev){
        var placed = false;
        for(var i=0;i<columns.length;i++){
          var lastInCol = columns[i][columns[i].length-1];
          if(lastInCol.startMin + lastInCol.duration <= ev.startMin){
            columns[i].push(ev);
            placed = true;
            break;
          }
        }
        if(!placed) columns.push([ev]);
      });
      var colCount = columns.length;
      columns.forEach(function(colArr, idx){
        colArr.forEach(function(ev){
          layout[ev.id] = { colIndex: idx, colCount: colCount };
        });
      });
      cluster = [];
      clusterEnd = -Infinity;
    }

    sorted.forEach(function(ev){
      if(cluster.length && ev.startMin >= clusterEnd){
        flushCluster();
      }
      cluster.push(ev);
      clusterEnd = Math.max(clusterEnd, ev.startMin + ev.duration);
    });
    flushCluster();

    return layout;
  }

  function renderEvents(){
    [bodyAdvising, bodyActivations].forEach(function(col){
      col.querySelectorAll(".event").forEach(function(el){ el.remove(); });
    });

    var laneLayouts = {
      advising: computeLaneLayout(state.events.filter(function(e){ return e.column === "advising"; })),
      activations: computeLaneLayout(state.events.filter(function(e){ return e.column === "activations"; }))
    };

    state.events.forEach(function(ev){
      if(ev.column === "talk") return; // rendered as a merged chip inside the talk card instead
      var academic = academicById(ev.academicId);
      if(!academic) return;
      var col = columnBodyFor(ev.column);
      var el = document.createElement("div");
      el.className = "event";
      el.dataset.eventId = ev.id;
      el.style.setProperty("--acc", academic.color);
      var top = ev.startMin * pxPerMin();
      var height = Math.max(ev.duration * pxPerMin(), 28);
      el.style.top = top + "px";
      el.style.height = height + "px";

      var lane = laneLayouts[ev.column][ev.id] || { colIndex: 0, colCount: 1 };
      var margin = 6, gap = 4;
      var colWidth = col.clientWidth;
      var availableWidth = Math.max(colWidth - margin*2 - gap*(lane.colCount-1), 20);
      var laneWidth = availableWidth / lane.colCount;
      var laneLeft = margin + lane.colIndex * (laneWidth + gap);
      el.style.left = laneLeft + "px";
      el.style.width = laneWidth + "px";
      el.style.right = "auto";
      el.style.zIndex = "";

      var closeBtn = document.createElement("button");
      closeBtn.className = "ev-close";
      closeBtn.type = "button";
      closeBtn.textContent = "✕";
      closeBtn.title = "Remove session";
      closeBtn.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
      closeBtn.addEventListener("click", function(e){
        e.stopPropagation();
        state.events = state.events.filter(function(x){ return x.id !== ev.id; });
        save(); renderEvents();
      });
      el.appendChild(closeBtn);

      var nameEl = document.createElement("div");
      nameEl.className = "ev-name";
      nameEl.textContent = academic.name;
      el.appendChild(nameEl);

      var timeEl = document.createElement("div");
      timeEl.className = "ev-time mono";
      var absStart = state.dayStartMin + ev.startMin;
      var displayDuration = (ev.labelDuration != null) ? ev.labelDuration : ev.duration;
      var absEnd = absStart + displayDuration;
      timeEl.textContent = minToTime12(absStart) + "–" + minToTime12(absEnd);
      timeEl.title = "Click to edit exact times";
      timeEl.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
      timeEl.addEventListener("click", function(e){
        e.stopPropagation();
        openTimeEditor(el, ev);
      });
      el.appendChild(timeEl);

      var handle = document.createElement("div");
      handle.className = "resize-handle";
      el.appendChild(handle);

      attachEventDrag(el, ev, handle);
      col.appendChild(el);
    });

    renderFixedBlocks();
  }

  function openTimeEditor(el, ev){
    var timeEl = el.querySelector(".ev-time");
    var absStart = state.dayStartMin + ev.startMin;
    var displayDuration = (ev.labelDuration != null) ? ev.labelDuration : ev.duration;
    var absEnd = absStart + displayDuration;
    timeEl.innerHTML = "";
    var startInput = document.createElement("input");
    startInput.type = "time";
    startInput.value = minToTimeStr(absStart);
    var dash = document.createTextNode("–");
    var endInput = document.createElement("input");
    endInput.type = "time";
    endInput.value = minToTimeStr(absEnd);
    timeEl.appendChild(startInput);
    timeEl.appendChild(dash);
    timeEl.appendChild(endInput);
    startInput.focus();

    function commit(){
      var newStartAbs = timeStrToMin(startInput.value);
      var newEndAbs = timeStrToMin(endInput.value);
      if(newEndAbs <= newStartAbs){ newEndAbs = newStartAbs + MIN_DURATION; }
      ev.startMin = Math.max(0, newStartAbs - state.dayStartMin);
      ev.duration = Math.max(MIN_DURATION, newEndAbs - newStartAbs);
      ev.labelDuration = null;
      save();
      renderEvents();
    }
    [startInput, endInput].forEach(function(inp){
      inp.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
      inp.addEventListener("change", commit);
      inp.addEventListener("blur", function(){ setTimeout(commit, 100); });
    });
  }

  function buildPersonTile(person, list, onRemoved, showDelete){
    var tile = document.createElement("div");
    tile.className = "tile";
    tile.dataset.academicId = person.id;
    tile.style.setProperty("--acc", person.color);

    var nameEl = document.createElement("span");
    nameEl.className = "name";
    nameEl.textContent = person.name;
    tile.appendChild(nameEl);

    if(showDelete){
      var delBtn = document.createElement("button");
      delBtn.className = "del-academic";
      delBtn.type = "button";
      delBtn.textContent = "✕";
      delBtn.title = "Remove and clear their placed sessions";
      delBtn.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
      delBtn.addEventListener("click", function(e){
        e.stopPropagation();
        var idx = list.indexOf(person);
        if(idx !== -1) list.splice(idx, 1);
        state.events = state.events.filter(function(ev){ return ev.academicId !== person.id; });
        save();
        onRemoved();
        renderEvents();
      });
      tile.appendChild(delBtn);
    }

    attachTrayDrag(tile, person);
    return tile;
  }

  function renderTray(){
    trayTiles.innerHTML = "";
    state.academics.forEach(function(academic){
      trayTiles.appendChild(buildPersonTile(academic, state.academics, renderTray, false));
    });
  }

  function renderStaffTray(){
    staffTrayTiles.innerHTML = "";
    state.staff.forEach(function(person){
      staffTrayTiles.appendChild(buildPersonTile(person, state.staff, renderStaffTray, true));
    });
  }

  function renderFixedBlocks(){
    var wrap = document.getElementById("calendarWrap");
    wrap.querySelectorAll(".fixed-block").forEach(function(el){ el.remove(); });
    bodyTalk.querySelectorAll(".talk-card").forEach(function(el){ el.remove(); });

    (state.fixedBlocks || []).forEach(function(fb){
      var startRel = fb.startAbsMin - state.dayStartMin;
      if(startRel + fb.duration < 0 || startRel > (state.dayEndMin - state.dayStartMin)) return;
      var visibleDuration = Math.min(fb.duration, (state.dayEndMin - state.dayStartMin) - startRel);
      var height = Math.max(visibleDuration * pxPerMin(), 22);
      var absStart = fb.startAbsMin, absEnd = fb.startAbsMin + fb.duration;
      var topOffset = Math.max(0, startRel) * pxPerMin();

      // blocks with no fb.column apply to BOTH working columns: render one
      // centred banner in Course Advising and a separate one in Activations,
      // each with the full title/time/location. These sit BELOW academic
      // tiles (not on top), so a dragged academic always stays visible.
      var targetCols = fb.column ? [fb.column] : ["advising", "activations"];
      targetCols.forEach(function(colName){
        var hostCol = (colName === "advising") ? bodyAdvising : bodyActivations;
        var el = document.createElement("div");
        el.className = "fixed-block";
        el.style.left = "6px";
        el.style.right = "6px";
        el.style.width = "auto";
        el.style.margin = "0";
        el.style.top = topOffset + "px";
        el.style.height = height + "px";

        var titleEl = document.createElement("span");
        titleEl.className = "fb-title";
        titleEl.textContent = fb.title + " · " + minToTime12(absStart) + "–" + minToTime12(absEnd);
        el.appendChild(titleEl);

        if(fb.location){
          var locEl = document.createElement("span");
          locEl.className = "fb-loc";
          locEl.textContent = fb.location;
          el.appendChild(locEl);
        }
        hostCol.appendChild(el);
      });

      // blocks that span the working columns (no fb.column) also get a
      // clean, fully-detailed card of their own in the dedicated talk column.
      // Any academics dropped onto the talk merge INTO this card as
      // colour-coded name chips, rather than sitting as separate tiles.
      if(!fb.column){
        var card = document.createElement("div");
        card.className = "talk-card";
        card.style.left = "6px";
        card.style.right = "6px";
        card.style.width = "auto";
        card.style.margin = "0";
        card.style.top = Math.max(0, startRel) * pxPerMin() + "px";

        var cTitle = document.createElement("div");
        cTitle.className = "tc-title";
        cTitle.textContent = fb.title;
        card.appendChild(cTitle);

        var cTime = document.createElement("div");
        cTime.className = "tc-time mono";
        cTime.textContent = minToTime12(absStart) + "–" + minToTime12(absEnd);
        card.appendChild(cTime);

        if(fb.location){
          var cLoc = document.createElement("div");
          cLoc.className = "tc-loc";
          cLoc.textContent = fb.location;
          card.appendChild(cLoc);
        }

        var assigned = state.events.filter(function(e){ return e.column === "talk"; });
        if(assigned.length){
          var chipsWrap = document.createElement("div");
          chipsWrap.className = "tc-chips";
          assigned.forEach(function(ev){
            var person = academicById(ev.academicId);
            if(!person) return;
            var chip = document.createElement("div");
            chip.className = "tc-chip";
            chip.style.setProperty("--acc", person.color);
            var chipName = document.createElement("span");
            chipName.className = "tc-chip-name";
            chipName.textContent = person.name;
            chip.appendChild(chipName);
            var chipClose = document.createElement("button");
            chipClose.className = "tc-chip-close";
            chipClose.type = "button";
            chipClose.textContent = "✕";
            chipClose.title = "Remove from talk";
            chipClose.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
            chipClose.addEventListener("click", function(e){
              e.stopPropagation();
              state.events = state.events.filter(function(x){ return x.id !== ev.id; });
              save(); renderEvents();
            });
            chip.appendChild(chipClose);
            chipsWrap.appendChild(chip);
          });
          card.appendChild(chipsWrap);
        }

        var minCardHeight = Math.max(height, 64 + assigned.length * 26);
        card.style.height = minCardHeight + "px";

        bodyTalk.appendChild(card);
      }
    });
  }

  function renderAll(){
    renderGutterAndGrid();
    renderTray();
    renderStaffTray();
    renderEvents();
    renderFixedBlocks();
  }

  // ---------- drag: new session from tray ----------
  function attachTrayDrag(tile, academic){
    tile.addEventListener("pointerdown", function(e){
      if(e.target.classList.contains("del-academic")) return;
      e.preventDefault();
      var startX = e.clientX, startY = e.clientY;
      var moved = false;
      var clone = null;
      var finished = false;

      function cleanup(){
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onCancel);
        highlightColumns(false);
      }

      function onMove(ev){
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        if(!moved && Math.abs(dx) + Math.abs(dy) > 4){
          moved = true;
          clone = tile.cloneNode(true);
          clone.classList.add("drag-clone");
          clone.style.width = tile.offsetWidth + "px";
          document.body.appendChild(clone);
          highlightColumns(true);
        }
        if(moved && clone){
          clone.style.left = (ev.clientX - tile.offsetWidth/2) + "px";
          clone.style.top = (ev.clientY - 18) + "px";
          updateColumnHover(ev.clientX, ev.clientY);
        }
      }
      function onUp(ev){
        if(finished) return;
        finished = true;
        cleanup();
        if(moved){
          var target = elementColumnAt(ev.clientX, ev.clientY);
          if(target){
            var isStaffPerson = state.staff.indexOf(academic) !== -1;
            var placement = computeDropPlacement(target, ev.clientY, isStaffPerson);
            state.events.push({
              id: nextId("ev"),
              academicId: academic.id,
              column: target.col,
              startMin: placement.startMin,
              duration: placement.duration
            });
            save();
            renderEvents();
          }
        }
        if(clone) clone.remove();
      }
      function onCancel(){
        if(finished) return;
        finished = true;
        cleanup();
        if(clone) clone.remove();
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onCancel);
    });
  }

  function elementColumnAt(x,y){
    var el = document.elementFromPoint(x,y);
    if(!el) return null;
    var colEl = el.closest(".column-body");
    if(!colEl) return null;
    var col = colEl.dataset.column;
    if(col !== "advising" && col !== "activations" && col !== "talk") return null;
    return { el: colEl, col: col };
  }

  var ADVISING_SLOT_BOUNDARY = 12*60+30; // 12:30pm
  var ADVISING_SLOT_A = { startAbsMin: 8*60+45, endAbsMin: 12*60+45 };  // 8:45am - 12:45pm
  var ADVISING_SLOT_B = { startAbsMin: 12*60+30, endAbsMin: 16*60+15 }; // 12:30pm - 4:15pm

  function computeDropPlacement(target, clientY, isStaffPerson){
    var rect = target.el.getBoundingClientRect();
    var offsetY = clientY - rect.top;
    if(target.col === "talk"){
      var talkFb = (state.fixedBlocks || []).filter(function(fb){ return !fb.column; })[0];
      if(talkFb){
        return {
          startMin: talkFb.startAbsMin - state.dayStartMin,
          duration: talkFb.duration
        };
      }
    }
    if(target.col === "advising" || isStaffPerson){
      var cursorAbsMin = state.dayStartMin + (offsetY / pxPerMin());
      var slot = (cursorAbsMin < ADVISING_SLOT_BOUNDARY) ? ADVISING_SLOT_A : ADVISING_SLOT_B;
      return {
        startMin: slot.startAbsMin - state.dayStartMin,
        duration: slot.endAbsMin - slot.startAbsMin
      };
    }
    var minutes = Math.round((offsetY / pxPerMin()) / SNAP) * SNAP;
    minutes = Math.max(0, Math.min(minutes, (state.dayEndMin - state.dayStartMin) - DEFAULT_DURATION));
    return { startMin: minutes, duration: DEFAULT_DURATION };
  }

  function highlightColumns(on){
    [bodyAdvising, bodyActivations, bodyTalk].forEach(function(c){ c.classList.remove("drop-hover"); });
  }
  function updateColumnHover(x,y){
    [bodyAdvising, bodyActivations, bodyTalk].forEach(function(c){ c.classList.remove("drop-hover"); });
    var target = elementColumnAt(x,y);
    if(target) target.el.classList.add("drop-hover");
  }

  // ---------- drag: move / resize existing event ----------
  function attachEventDrag(el, ev, handle){
    el.addEventListener("pointerdown", function(e){
      if(e.target === handle || e.target.closest(".ev-close") || e.target.closest(".ev-time")) return;
      e.preventDefault();

      if(e.ctrlKey || e.metaKey){
        // Duplicate: drag a ghost copy, leave the original session untouched.
        var dupClone = el.cloneNode(true);
        dupClone.classList.add("drag-clone");
        dupClone.style.position = "fixed";
        dupClone.style.width = el.offsetWidth + "px";
        dupClone.style.height = el.offsetHeight + "px";
        document.body.appendChild(dupClone);
        highlightColumns(true);
        var dupFinished = false;

        function positionClone(cx, cy){
          dupClone.style.left = (cx - el.offsetWidth/2) + "px";
          dupClone.style.top = (cy - el.offsetHeight/2) + "px";
        }
        positionClone(e.clientX, e.clientY);

        function dupCleanup(){
          document.removeEventListener("pointermove", onDupMove);
          document.removeEventListener("pointerup", onDupUp);
          document.removeEventListener("pointercancel", onDupCancel);
          highlightColumns(false);
        }
        function onDupMove(pe){
          positionClone(pe.clientX, pe.clientY);
          updateColumnHover(pe.clientX, pe.clientY);
        }
        function onDupUp(pe){
          if(dupFinished) return;
          dupFinished = true;
          dupCleanup();
          var target = elementColumnAt(pe.clientX, pe.clientY);
          if(target){
            var isStaffPerson = state.staff.some(function(s){ return s.id === ev.academicId; });
            var placement = computeDropPlacement(target, pe.clientY, isStaffPerson);
            state.events.push({
              id: nextId("ev"),
              academicId: ev.academicId,
              column: target.col,
              startMin: placement.startMin,
              duration: placement.duration
            });
            save();
            renderEvents();
          }
          dupClone.remove();
        }
        function onDupCancel(){
          if(dupFinished) return;
          dupFinished = true;
          dupCleanup();
          dupClone.remove();
        }
        document.addEventListener("pointermove", onDupMove);
        document.addEventListener("pointerup", onDupUp);
        document.addEventListener("pointercancel", onDupCancel);
        return;
      }

      var startX = e.clientX, startY = e.clientY;
      var origTop = parseFloat(el.style.top);
      var currentCol = ev.column;
      var moveFinished = false;

      function moveCleanup(){
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onCancel);
        highlightColumns(false);
      }
      function onMove(pe){
        var dy = pe.clientY - startY;
        el.style.top = Math.max(0, origTop + dy) + "px";
        updateColumnHover(pe.clientX, pe.clientY);
      }
      function onUp(pe){
        if(moveFinished) return;
        moveFinished = true;
        moveCleanup();
        var target = elementColumnAt(pe.clientX, pe.clientY);
        var newCol = target ? target.col : currentCol;
        var newTopPx = parseFloat(el.style.top);
        var maxStart = (state.dayEndMin - state.dayStartMin) - ev.duration;
        var minutes = Math.round((newTopPx / pxPerMin()) / SNAP) * SNAP;
        minutes = Math.max(0, Math.min(minutes, Math.max(0,maxStart)));
        ev.startMin = minutes;
        ev.column = newCol;
        save();
        renderEvents();
      }
      function onCancel(){
        if(moveFinished) return;
        moveFinished = true;
        moveCleanup();
        renderEvents();
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onCancel);
    });

    handle.addEventListener("pointerdown", function(e){
      e.preventDefault();
      e.stopPropagation();
      var startY = e.clientY;
      var origHeight = parseFloat(el.style.height);
      var resizeFinished = false;

      function resizeCleanup(){
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onCancel);
      }
      function onMove(pe){
        var dy = pe.clientY - startY;
        var newHeight = Math.max(MIN_DURATION * pxPerMin(), origHeight + dy);
        el.style.height = newHeight + "px";
      }
      function onUp(pe){
        if(resizeFinished) return;
        resizeFinished = true;
        resizeCleanup();
        var newHeightPx = parseFloat(el.style.height);
        var minutes = Math.round((newHeightPx / pxPerMin()) / SNAP) * SNAP;
        ev.duration = Math.max(MIN_DURATION, minutes);
        ev.labelDuration = null;
        var maxStart = (state.dayEndMin - state.dayStartMin) - ev.duration;
        if(ev.startMin > maxStart) ev.startMin = Math.max(0,maxStart);
        save();
        renderEvents();
      }
      function onCancel(){
        if(resizeFinished) return;
        resizeFinished = true;
        resizeCleanup();
        renderEvents();
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onCancel);
    });
  }

  // ---------- controls ----------
  document.getElementById("clearBtn").addEventListener("click", function(){
    if(state.events.length && !confirm("Remove all placed sessions from the calendar?")) return;
    state.events = [];
    save();
    renderEvents();
  });

  dayStartInput.addEventListener("change", function(){
    var newStart = timeStrToMin(dayStartInput.value);
    if(newStart < state.dayEndMin - 30){
      state.dayStartMin = newStart;
      save();
      renderAll();
    } else {
      dayStartInput.value = minToTimeStr(state.dayStartMin);
    }
  });
  dayEndInput.addEventListener("change", function(){
    var newEnd = timeStrToMin(dayEndInput.value);
    if(newEnd > state.dayStartMin + 30){
      state.dayEndMin = newEnd;
      save();
      renderAll();
    } else {
      dayEndInput.value = minToTimeStr(state.dayEndMin);
    }
  });

  window.addEventListener("resize", function(){ renderEvents(); });

  function applyNameColorOverrides(){
    state.academics.forEach(function(academic){
      var forced = colorForName(academic.name);
      if(forced) academic.color = forced;
    });
  }

  // ---------- init ----------
  load();
  seedDefaults();
  seedStaffDefaults();
  applyNameColorOverrides();
  seedDefaultEvents();
  paletteIndex = state.academics.length;
  (function recomputeUidCounter(){
    var maxId = 0;
    state.academics.concat(state.staff).concat(state.events).forEach(function(o){
      var n = parseInt((o.id||"").replace(/\D/g,""),10);
      if(!isNaN(n) && n > maxId) maxId = n;
    });
    uid = maxId + 1;
  })();
  dayStartInput.value = minToTimeStr(state.dayStartMin);
  dayEndInput.value = minToTimeStr(state.dayEndMin);
  renderAll();
  save();
})();
</script>
</body>
</html>
